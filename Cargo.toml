[package]
name = "agent-runner-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time", "net", "signal", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
zeroize = "1.9.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
base64 = "=0.23.1"
futures = "0.3"
tracing = "0.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["process", "rand"] }
libc = "=0.2.189"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt", "test-util"] }
tempfile = "3.27.0"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
