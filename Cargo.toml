[package]
name = "agent-runner-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "=1.53.1", features = ["macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
zeroize = "1.9.0"


[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt", "test-util"] }
tempfile = "3.27.0"
